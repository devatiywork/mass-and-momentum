# ============================================================================
#  Presets by vehicle type — LabVehiclePhysics
#
#  Ready-made sets of specs for vehicles the mod knows nothing about:
#  they are not in the built-in reference, and their mod author has sent no
#  data through the Lua API. The player picks a preset in vehicle-physics.cfg:
#
#      *SomeTank*: preset=tank                  ready-made preset
#      *SomeTank*: preset=tank mass=38000       preset with an override: values
#                                               set in the line override the preset
#
#  Line format is the same as in the reference, except that the left side is
#  a preset name, not a mask. All brakes are auto, from mass, as in the reference.
#
#  The numbers are typical vehicles of the late 80s to early 90s, consistent
#  with the reference (vehicle-physics-defaults.cfg). Power-to-weight stays
#  within each category: cars about 100 hp/t, SUVs and pickups 85-95, vans 80,
#  military trucks about 30, armour 20-30, tracked vehicles about 20.
#  maxSpeed is in km/h, tank is the fuel tank in litres.
# ============================================================================

#  --- civilian ---
small_car: mass=1000 power=75 maxSpeed=110 tank=45 brakeMul=auto category=car
car: mass=1400 power=140 maxSpeed=115 tank=60 brakeMul=auto category=car
sports_car: mass=1450 power=300 maxSpeed=120 tank=70 brakeMul=auto category=car
suv: mass=2000 power=170 maxSpeed=110 tank=80 lowGear=1.5 lowGearTo=20 brakeMul=auto category=suv
pickup: mass=2100 power=200 maxSpeed=110 tank=100 lowGear=1.5 lowGearTo=20 brakeMul=auto category=pickup
van: mass=2500 power=200 maxSpeed=100 tank=95 lowGear=1.5 lowGearTo=20 brakeMul=auto category=van
light_truck: mass=3600 power=190 maxSpeed=90 tank=120 lowGear=1.5 lowGearTo=20 brakeMul=auto category=delivery_van
truck: mass=9000 power=280 maxSpeed=90 tank=300 lowGear=2.5 lowGearTo=25 brakeMul=auto category=truck
bus: mass=11000 power=250 maxSpeed=90 tank=300 lowGear=2 lowGearTo=25 brakeMul=auto category=bus

#  --- military ---
light_military: mass=2400 power=150 maxSpeed=110 tank=95 lowGear=2 lowGearTo=30 brakeMul=auto category=light_military
military_truck: mass=12000 power=350 maxSpeed=90 tank=300 lowGear=2.5 lowGearTo=25 brakeMul=auto category=military_truck
armored_car: mass=9000 power=250 maxSpeed=100 tank=300 lowGear=2.5 lowGearTo=30 brakeMul=auto category=wheeled_armour
wheeled_apc: mass=14000 power=300 maxSpeed=100 tank=300 lowGear=2.5 lowGearTo=30 brakeMul=auto category=wheeled_armour
tracked_apc: mass=12000 power=275 maxSpeed=65 tank=360 lowGear=2.5 lowGearTo=15 brakeMul=auto category=tracked_armour
light_tank: mass=25000 power=550 maxSpeed=65 tank=600 lowGear=2 lowGearTo=15 brakeMul=auto category=tracked_armour
tank: mass=45000 power=750 maxSpeed=50 tank=1000 lowGear=2 lowGearTo=12 brakeMul=auto category=tracked_armour

#  --- trailers ---
trailer: mass=400 brakeMul=auto category=trailer
heavy_trailer: mass=2000 brakeMul=auto category=trailer

# ============================================================================
#  LabVehiclePhysics — встроенные паспорта машин (слой 3)
#
#  Этот файл едет вместе с модом. Благодаря ему у человека, скачавшего мод,
#  машины сразу весят и тянут по-настоящему, без всякой настройки.
#
#  Порядок слоёв, каждый следующий перекрывает предыдущий ПО ПОЛЮ:
#    1. этот файл                         — общий справочник
#    2. данные автора мода на технику     — Lua-таблица LabVehiclePhysicsData
#    3. vehicle-physics.cfg игрока        — в папке Zomboid, решает последним
#
#  Формат тот же, что у vehicle-physics.cfg: маска имени скрипта, двоеточие,
#  ключи. Правила проверяются сверху вниз, срабатывает первое подходящее —
#  поэтому частные маски стоят выше общих.
#
#  Только паспортные величины:
#    mass       кг
#    power      л.с. — мод сам переводит в тягу: 48.2 x л.с. / engineForce скрипта.
#               Масса в формуле сокращается, поэтому у раскрасок одного кузова с
#               разной тягой в скрипте множитель получается свой, верный.
#    maxSpeed   км/ч, в игре жёсткий общий потолок ~122
#    tank       литры
#    lowGear    коэффициент трансформации гидротрансформатора на трогании,
#    lowGearTo  км/ч, где он сходит к единице
#    brakeMul   auto — тормоза масштабируются вместе с массой
#    category   car, suv, pickup, van, delivery_van, light_military,
#               wheeled_armour, military_truck, tracked_armour, trailer
#
#  Флагов live и service здесь нет: это инструменты игрока, а не данные машины.
#
#  Цифры со знаком "~" в комментариях источником не подтверждены — оценка.
# ============================================================================


# ============================================================================
#  МОДОВАЯ ТЕХНИКА
# ============================================================================


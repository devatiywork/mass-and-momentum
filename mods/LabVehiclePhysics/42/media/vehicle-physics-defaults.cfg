# ============================================================================
#  LabVehiclePhysics — built-in vehicle passports (layer 3)
#
#  This file ships with the mod. Thanks to it, anyone who downloads the mod
#  gets vehicles with real weight and pull right away, with no setup at all.
#
#  Layer order; each next layer overrides the previous one FIELD BY FIELD:
#    1. this file                         — shared reference
#    2. data from the vehicle mod author  — Lua table LabVehiclePhysicsData
#    3. the player's vehicle-physics.cfg  — in the Zomboid folder, has the last word
#
#  Same format as vehicle-physics.cfg: script name mask, colon,
#  keys. Rules are checked top to bottom and the first match wins,
#  so specific masks go above general ones.
#
#  Passport values only:
#    mass       kg
#    power      hp; the mod converts it to engine force so that pull per kilogram matches
#               the rated power-to-weight, anchored on the vanilla passenger car:
#               34.75 x hp x (script mass + ~310 kg of parts) / mass / the script's engineForce.
#               Liveries of one body whose scripts differ in engine force each get their
#               own correct multiplier.
#    maxSpeed   real top speed, km/h. Applied to modded vehicles only: vanilla vehicles keep
#               the game's own top speed. The game has a hard global cap of ~122
#    tank       litres
#    lowGear    TOTAL pull-away multiplier (torque converter + low gear). Vanilla first
#               gear already gives 1.5, so values up to 1.5 add nothing; meant for heavy
#               vehicles (2..3).
#    lowGearTo  km/h at which the extra fades to 1
#    brakeMul   auto: brakes scale with mass
#    category   car, suv, pickup, van, delivery_van, light_military,
#               wheeled_armour, military_truck, tracked_armour, trailer
#
#  There are no live or service flags here: those are player tools, not vehicle data.
#
#  Figures marked "~" in the comments are not confirmed by a source; they are estimates.
# ============================================================================


# ============================================================================
#  MODDED VEHICLES
# ============================================================================

#  --- KI5 ---

#  ADI Bushmaster PMV: curb weight 11,400 kg (gross 15,400), Caterpillar 3126E
#  7.2 L 300 hp, 100 km/h, 319 L tank, range 800 km.
*97bush*: mass=11400 power=300 maxSpeed=100 tank=319 lowGear=3 lowGearTo=30 brakeMul=auto category=wheeled_armour

#  Cadillac Gage V-100 Commando (M706): 7,370 kg, Chrysler 361 V8 210 hp,
#  100 km/h, 303 L tank. Automatic with a torque converter.
*67commando*: mass=7370 power=210 maxSpeed=100 tank=303 lowGear=2.5 lowGearTo=30 brakeMul=auto category=wheeled_armour

#  Cadillac Gage V-300 / LAV-300: combat weight 14,696 kg, Cummins 6CTA8.3 260 hp,
#  105 km/h, 302 L tank. 6x6.
*84gageV300*: mass=14696 power=260 maxSpeed=105 tank=302 lowGear=2.5 lowGearTo=30 brakeMul=auto category=wheeled_armour

#  Daimler Ferret Mk2: 3,700 kg, Rolls-Royce B60 130 hp, 93 km/h,
#  tank 24 imperial gallons = 109 L. No separate mass found for the Mk3; the same one is used.
*62daimlerFerret*: mass=3700 power=130 maxSpeed=93 tank=109 lowGear=2 lowGearTo=20 brakeMul=auto category=wheeled_armour

#  Oshkosh P-19 ARFF: curb weight 16,220 kg, CAT C-15 600 hp, 116 km/h.
#  Tank ~300 L. All variants (USMC, KYFD, FRTR55) share one rule: power itself
#  accounts for the different engine force in their scripts.
*86oshkosh*: mass=16220 power=600 maxSpeed=116 tank=300 lowGear=2.5 lowGearTo=30 brakeMul=auto category=military_truck

#  MAN KAT1 7t milgl 6x6: curb weight 13,830 kg, Deutz 320 hp.
#  Top speed ~90 km/h and tank ~400 L are not confirmed by a source.
*80manKat1*: mass=13830 power=320 maxSpeed=90 tank=400 lowGear=2.5 lowGearTo=25 brakeMul=auto category=military_truck

#  The Land Rover trailer goes ABOVE the vehicles: the mask *89defender* would cover it too.
*Trailer89defender*: mass=750 brakeMul=auto category=trailer

#  Land Rover Defender, 200Tdi 107 hp. Passport top speed is 137, but the game
#  allows no more than ~122. Tanks ~79 L (110/130) and ~60 L (90). Manual gearbox: modest lowGear.
*89defender130*: mass=2050 power=107 maxSpeed=120 tank=79 brakeMul=auto category=light_military
*89defender110*: mass=1917 power=107 maxSpeed=120 tank=79 brakeMul=auto category=light_military
*89defender90*: mass=1700 power=107 maxSpeed=120 tank=60 brakeMul=auto category=light_military
*89defender*: mass=1917 power=107 maxSpeed=120 tank=79 brakeMul=auto category=light_military

#  Oshkosh trailers: ~ estimates.
*TrailerM1095*: mass=2300 brakeMul=auto category=trailer
*TrailerM1082*: mass=1600 brakeMul=auto category=trailer

